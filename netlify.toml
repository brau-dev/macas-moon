[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "BOOKING_ACTIVE_DOMES,BOOKING_CURRENCY,BOOKING_ENABLED,NEXT_PUBLIC_BOOKING_TEST_MODE,TILOPAY_CHECKOUT_ENABLED,BOOKING_RECONCILE_ENABLED,PRICE_DOMO_AMPLIO_CENTS,PRICE_DOMO_ROMANTICO_CENTS"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
